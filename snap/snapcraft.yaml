name: cannonball
version: '0.34'
base: core24

platforms:
  amd64:
  arm64:
  armhf:
  ppc64el:
  s390x:
summary: The Enhanced OutRun Engine
description: |
 CannonBall is a program which allows you to play an enhanced version
 of Yu Suzuki's seminal arcade racer, OutRun. Cannonball is not an
 emulator; it is a complete rewrite of the original game into portable
 C++.

 **Enhancements**

   * 60 fps gameplay (smoother than the original game)
   * True widescreen mode (extend the play area by 25%)
   * High Resolution mode (improves sprite scaling)
   * New Camera Views
   * Time Trial Mode (Beat your time on a chosen level)
   * Continuous Mode (Play all 15 stages sequentially)
   * Western, Japanese & Prototype Track Support
   * Support for Custom Tracks from LayOut
   * Customisable Music
   * Toggle Fixed Audio ROM
   * High Score Saving
   * Analog and Digital Controllers Supported
   * Automatic gear change
   * Cheats (No Traffic, Infinite Time)
   * Optional Attract Mode AI Improvements
   * More level objects

 **Bug Fixes**
 Fixes for bugs present in the original game:
   * Erroneous shadow fix
   * Sprite zoom fix
   * Correct millisecond value shown on passing checkpoint
   * Steering bug
   * Misplaced tile on music selection screen fixed

 **Controls**

 Connect joypads, steering wheels and pedals before starting Cannonball.

 The default keys are as follows. You can redefine the keys in the menu.

   * Cursors: Steering
   * Z: Accelerate
   * X: Brake
   * Space: Gear Change
   * 5: Insert Coin
   * 1: Start
   * Shift: Change Camera View
   * F1: Pause
   * F2: Advance a frame when paused (useful for observing visual problems)
   * F3: Toggle/Freeze timers. (i.e. infinite time)
   * F5: Menu

 Manual <https://github.com/djyt/cannonball/wiki/Cannonball-Manual>
 Wiki <https://github.com/djyt/cannonball/wiki>

grade: stable
confinement: strict

layout:
  /usr/share/X11/xkb:
    bind: $SNAP/usr/share/X11/xkb
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/alsa-lib:
    bind: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/alsa-lib
  /usr/share/alsa:
    bind: $SNAP/usr/share/alsa

parts:
  alsa-mixin:
    plugin: dump
    source: https://github.com/diddlesnaps/snapcraft-alsa.git
    source-subdir: snapcraft-assets
    build-packages:
      - libasound2-dev
    stage-packages:
      - libasound2t64
      - libasound2-plugins
      - yad

  desktop:
    after: [ alsa-mixin ]
    source: https://github.com/ubuntu/snapcraft-desktop-helpers.git
    source-subdir: glib-only
    plugin: make
    build-packages:
      - libglib2.0-dev
    stage-packages:
      - libglib2.0-bin

  cannonball:
    after: [ desktop ]
    plugin: cmake
    source: https://github.com/djyt/cannonball.git
    source-tag: v0.34
    build-packages:
      - g++
      - patch
      - libboost-dev
      - libsdl2-dev
      - libgl1-mesa-dev
    stage-packages:
      - libsdl2-2.0-0
    override-pull: |
      craftctl default
      patch -p1 < "$CRAFT_PROJECT_DIR/snap/local/menu-cstdint.patch"
      patch -p1 < "$CRAFT_PROJECT_DIR/snap/local/sdl-renderer-errors.patch"
    override-build: |
      cmake -S "$CRAFT_PART_SRC/cmake" -B "$CRAFT_PART_BUILD" -DTARGET=linux.cmake -DCMAKE_BUILD_TYPE=Release
      cmake --build "$CRAFT_PART_BUILD" --parallel "$CRAFT_PARALLEL_BUILD_COUNT"
      strip --strip-unneeded "$CRAFT_PART_BUILD/cannonball"
      install -Dm755 "$CRAFT_PART_BUILD/cannonball" "$CRAFT_PART_INSTALL/opt/cannonball/cannonball"
      mkdir -p "$CRAFT_PART_INSTALL/opt/cannonball"/{docs,res}
      cp -R "$CRAFT_PART_SRC/docs/." "$CRAFT_PART_INSTALL/opt/cannonball/docs/"
      cp -R "$CRAFT_PART_SRC/res/." "$CRAFT_PART_INSTALL/opt/cannonball/res/"
      cp -R "$CRAFT_PART_SRC/roms/." "$CRAFT_PART_INSTALL/opt/cannonball/docs/"

  cannonball-wrapper:
    after:
      - alsa-mixin
      - desktop
      - cannonball
    plugin: dump
    source: snap/local/
    stage-packages:
      - bsdiff
      - xkb-data
      - unzip
      - wget
      - yad
    organize:
      cannonball-wrapper: bin/
      opr-10188.71.bsdiff: opt/cannonball/patches/

apps:
  cannonball:
    command: opt/cannonball/cannonball
    extensions: [gpu]
    command-chain:
      - bin/desktop-launch
      - snap/command-chain/alsa-launch
      - bin/cannonball-wrapper
    environment:
      ALWAYS_USE_PULSEAUDIO: 1
      LC_ALL: C
    plugs:
      - audio-playback
      - desktop
      - desktop-legacy
      - joystick
      - network
      - opengl
      - wayland
      - x11
